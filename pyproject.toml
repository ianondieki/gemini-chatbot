[project]
name = "gemini-agent"
version = "2.0.0"
description = "A deliberate Gemini agent: plan, act, observe, critique, revise."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:gemini_agent.*"]
